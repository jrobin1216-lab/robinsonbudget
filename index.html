<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robinson Finances</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0b; color: #e7e7ea; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0a0a0b;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .3s; }
  .splash img { width: 72px; height: 72px; border-radius: 18px; }
  .splash p { margin: 0; color: #8c8c93; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .offline { display: none; max-width: 300px; text-align: center; }
  .offline button { margin-top: 12px; background: #8b7cf6; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="">
  <p id="status">Loading your finances…</p>
  <div class="offline" id="offline">You're offline. Connect to the internet to see your dashboard.<br><button type="button" onclick="location.reload()">Try again</button></div>
</div>
<iframe id="app" title="Robinson Finances" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbykwvHDzjpNuF0-rgWNFh68_MHahwGbyQM_bdogVTxNzvaRpDKTBsyS789BNBoWTb5n/exec"></iframe>
<script>
  var splash = document.getElementById('splash'), frame = document.getElementById('app');
  frame.style.visibility = 'hidden';
  function show() { frame.style.visibility = ''; splash.classList.add('gone'); }
  if (!navigator.onLine) {
    document.getElementById('status').hidden = true;
    document.getElementById('offline').style.display = 'block';
  } else {
    frame.addEventListener('load', show);
    setTimeout(show, 8000);  // never leave the splash up if the load event is slow
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* app still works without it */ });
</script>
</body>
</html>
